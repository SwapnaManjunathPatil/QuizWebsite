<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Certificate</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        .certificate {
            background: white;
            padding: 50px;
            border: 10px solid #3498db;
            border-radius: 20px;
            max-width: 800px;
            margin: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #2c3e50;
            font-size: 40px;
        }

        h2 {
            margin-top: 20px;
            font-size: 30px;
            color: #34495e;
        }

        p {
            font-size: 20px;
            margin: 20px 0;
        }

        .name {
            font-size: 32px;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="certificate">
        <h1>Certificate of Achievement</h1>

        <p>This certificate is proudly presented to</p>
        <h1 id="certificate-user"></h1>
        <div class="name">Quiz Participant</div>

        <p>for successfully completing the Smart Quiz Website Assessment</p>

        <h2>🏆 Congratulations! 🏆</h2>
        <h3 id="certificate-name"></h3>
        <p>Date: May 2026</p>

        <p>Authorized Signature</p>
    </div>
    <script>
        const username = localStorage.getItem("certificateName");

        document.getElementById("certificate-user").innerText = username;
    </script>

</body>
</html>
