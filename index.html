<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Website with Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-container">
        <h2>Quiz Website</h2>

        <input type="text" id="username" placeholder="Enter Username" required>
        <input type="password" id="password" placeholder="Enter Password" required>

        <button onclick="registerUser()">Register</button>
        <button onclick="loginUser()">Login</button>
    </div>

    <div id="start-screen" style="display:none;">
        <h2>Welcome <span id="welcome-user"></span> 👋</h2>
        <button onclick="startQuiz()">Start Quiz</button>
    </div>

    <div class="quiz-container">

         <div id="category-screen" style="display:none;">
            <h1>Welcome to Quiz Website</h1>
            <h3>Select Quiz Category</h3>

            <button class="category-btn" onclick="startCategoryQuiz('java')">Java Quiz</button>

            <button class="category-btn" onclick="startCategoryQuiz('python')">Python Quiz</button>

             <button class="category-btn" onclick="startCategoryQuiz('gk')">GK Quiz</button>

            <button class="category-btn" onclick="startCategoryQuiz('aptitude')">Aptitude Quiz</button>
        </div>

        <div id="quiz-screen" style="display: none;">
            <h1>Simple Quiz Website</h1>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>

            <p id="progress-text">Question 1 of 10</p>

            <div id="timer">Time Left: 30s</div>

            <div id="question">Question comes here</div>

            <div id="answer-buttons" class="btn-grid"></div>

            <button id="next-btn">Next Question</button>

            <div id="result" style="display: none;">
                <h2>Your Result</h2>
                <p id="score-text"></p>
                <button id="restart-btn" style="display: none;">Restart Quiz</button>
                <button id="certificate-btn" style="display: none;">
                    Download Certificate
                </button>
                <div id="leaderboard" style="margin-top: 20px;">
                    <h3>Leaderboard</h3>
                    <ul id="leaderboard-list"></ul>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
